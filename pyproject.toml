[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oqaasileriffik-kal-eng-dicts"
version = "0.1.0"
description = "Oqaasileriffik KAL-ENG dictionaries conversion pipeline"
requires-python = ">=3.10"
dependencies = [
    "odfpy==1.4.1",
    "jsonschema==4.23.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.6.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "types-jsonschema"
]

[tool.setuptools]
packages = ["convert"]
