[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oqaasileriffik-kal-eng-dicts"
version = "0.1.0"
description = "Oqaasileriffik KAL-ENG dictionaries conversion pipeline"
requires-python = ">=3.10"
dependencies = [
    "odfpy==1.4.1",
    "jsonschema==4.23.0",
    "nltk>=3.8.1"
]

[project.scripts]
convert-dicts = "convert.convert:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.6.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "types-jsonschema"
]

[tool.setuptools]
packages = ["convert"]

[tool.setuptools.package-data]
convert = ["*.json"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "odf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nltk.*"
ignore_missing_imports = true
