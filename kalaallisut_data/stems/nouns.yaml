morphemes:
  iglu:
    _template: noun_stem
    lexical_facts:
      meaning: "house, home"
    application_logic:
      underlying_form: "iglu"
    pedagogy:
      examples:
        - surface: "iglumi"
          natural: "in the house"
    provenance: ["Fortescue1984:109"]

  qimmeq:
    _template: noun_stem
    lexical_facts:
      meaning: "dog"
    application_logic:
      underlying_form: "qimmeq"
    pedagogy:
      examples:
        - surface: "qimmeqarpoq"
          natural: "He has a dog."
    provenance: ["Fortescue1984:270"]

  inuk:
    _template: noun_stem
    lexical_facts:
      meaning: "person, human being"
    application_logic:
      underlying_form: "inuk"
    pedagogy:
      examples:
        - surface: "inuit"
          natural: "people (absolutive plural)"
    provenance: ["Fortescue1984:114"]

  nuna:
    _template: noun_stem
    lexical_facts:
      meaning: "land, country, ground"
    application_logic:
      underlying_form: "nuna"
    pedagogy:
      examples:
        - surface: "Nunarsuaq"
          natural: "Greenland (literally: the great land)"
    provenance: ["Fortescue1984:218"]

  siku:
    _template: noun_stem
    lexical_facts:
      meaning: "sea ice"
    application_logic:
      underlying_form: "siku"
    pedagogy:
      examples:
        - surface: "sikumi"
          natural: "on the sea ice"
    provenance: ["Fortescue1984:289"]

  atuarfik:
    _template: noun_stem
    lexical_facts:
      meaning: "school (place for reading/studying)"
    application_logic:
      underlying_form: "atuarfik"
      notes: ["Itself a derived noun: atuarpoq (reads) + -fik (place for)"]
    pedagogy:
      examples:
        - surface: "atuarfimmut"
          natural: "to school (allative)"
    provenance: ["Fortescue1984:20"]

  angut:
    _template: noun_stem
    lexical_facts:
      meaning: "man, male"
    application_logic:
      underlying_form: "angut"
    pedagogy:
      examples:
        - surface: "angutaavoq"
          natural: "He is a man."
    provenance: ["Fortescue1984:13"]

  arnaq:
    _template: noun_stem
    lexical_facts:
      meaning: "woman, female"
    application_logic:
      underlying_form: "arnaq"
    pedagogy:
      examples:
        - surface: "arnap"
          natural: "the woman's / the woman (ergative)"
    provenance: ["Fortescue1984:16"]
