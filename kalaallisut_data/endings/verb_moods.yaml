morphemes:
  V_IND_INTR_3SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "indicative intransitive, 3rd person singular (he/she/it V-s)"
    application_logic:
      underlying_form: "-voq"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
      notes: ["Surface -poq after certain consonants (p/t/k)"]
    pedagogy:
      examples:
        - surface: "nerivoq"
          natural: "He eats."
        - surface: "sinivoq"
          natural: "He sleeps."
    provenance: ["Fortescue1984:29", "Lybech2020:60"]

  V_IND_INTR_1SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "indicative intransitive, 1st person singular (I V)"
    application_logic:
      underlying_form: "-vunga"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
    pedagogy:
      examples:
        - surface: "nerivunga"
          natural: "I eat."
        - surface: "takusinnaajunga"
          natural: "I can see."
    provenance: ["Fortescue1984:29"]

  V_IND_INTR_2SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "indicative intransitive, 2nd person singular (you V)"
    application_logic:
      underlying_form: "-vutit"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
    pedagogy:
      examples:
        - surface: "nerivutit"
          natural: "You eat."
    provenance: ["Fortescue1984:29"]

  V_IND_TR_3SG_3SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "indicative transitive, subject 3sg acts on object 3sg (he V-s it/him)"
    application_logic:
      underlying_form: "-aa"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
    pedagogy:
      examples:
        - surface: "takuaa"
          natural: "He sees it / He sees him."
        - surface: "nerissaa"
          natural: "He will eat it."
    provenance: ["Fortescue1984:29"]

  V_PART_INTR_3SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "participial intransitive, 3rd person singular (the one who V-s)"
    application_logic:
      underlying_form: "-soq"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
      notes: ["Doubles as a subordinate clause head; -joq after vowels in some environments"]
    pedagogy:
      examples:
        - surface: "nerisoq"
          natural: "the one who eats / the one eating"
        - surface: "sinissoq"
          natural: "the one who will sleep"
    provenance: ["Fortescue1984:29"]

  V_CAU_INTR_3SG:
    lexical_facts:
      morpheme_type: inflectional_ending
      meaning: "causative/subordinate intransitive, 3sg (because he V-s; when he V-s)"
    application_logic:
      underlying_form: "-mmata"
      boundary_behavior: additive
      continuation_class: WORD_FINAL
      notes: ["Signals co-reference with main-clause subject in some analyses"]
    pedagogy:
      examples:
        - surface: "siumut nerilersimammata"
          natural: "because they had already started eating"
    provenance: ["Fortescue1984:33"]
