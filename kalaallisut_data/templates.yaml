# Named templates — referenced by _template: key in morpheme entries.
# Resolution is done by convert_grammar.py (deep merge, not YAML anchors),
# so templates work across files and merging is recursive.

intrans_denominal_verb:
  lexical_facts:
    morpheme_type: derivational_affix
    category_shift: "N -> V"
    valency: intransitive
  application_logic:
    boundary_behavior: truncating
    continuation_class: V_POSTBASE

trans_denominal_verb:
  lexical_facts:
    morpheme_type: derivational_affix
    category_shift: "N -> V"
    valency: transitive
  application_logic:
    boundary_behavior: truncating
    continuation_class: V_POSTBASE

deverbal_noun:
  lexical_facts:
    morpheme_type: derivational_affix
    category_shift: "V -> N"
  application_logic:
    boundary_behavior: truncating
    continuation_class: N_POSTBASE

verbal_modifier_truncating:
  lexical_facts:
    morpheme_type: derivational_affix
    category_shift: "V -> V"
  application_logic:
    boundary_behavior: truncating
    continuation_class: V_POSTBASE

verbal_modifier_additive:
  lexical_facts:
    morpheme_type: derivational_affix
    category_shift: "V -> V"
  application_logic:
    boundary_behavior: additive
    continuation_class: V_POSTBASE

noun_stem:
  lexical_facts:
    morpheme_type: stem
    word_class: N
  application_logic:
    continuation_class: N_POSTBASE

verb_stem:
  lexical_facts:
    morpheme_type: stem
    word_class: V
  application_logic:
    continuation_class: V_POSTBASE
